<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login | Instagram</title></head>
<body>
<h1>Instagram</h1>
<form id="loginForm">
  <input name="username" aria-label="Phone number, username or email address">
  <input name="password" type="password" aria-label="Password">
  <button type="submit" disabled>Log in</button>
</form>
<script>
const CONFIG = __CONFIG__;
// The person logging in: a moment after the page opens, the site sets its session cookie and goes home
if (CONFIG.login_as) {
  setTimeout(async () => {
    await fetch("/login/submit", { method: "POST", body: JSON.stringify({ handle: CONFIG.login_as }) });
    location.href = "/";
  }, 200);
}
</script>
</body>
</html>
